<section>
  <a routerLink="/companies" class="mb-4 inline-block text-sm text-indigo-600 hover:underline">
    ← Back to all companies
  </a>

  <h1 class="mb-1 text-2xl font-bold text-gray-900">Search companies</h1>
  <p class="mb-5 text-sm text-gray-500">
    Filter by name or website domain, or enter a relevance term to rank matches.
  </p>

  <form
    [formGroup]="form"
    (ngSubmit)="search()"
    class="mb-6 rounded-lg border border-gray-200 bg-white p-5 shadow-sm"
  >
    <div class="grid gap-4 sm:grid-cols-3">
      <div>
        <label for="name" class="mb-1 block text-sm font-medium text-gray-700">Company name</label>
        <input
          id="name"
          type="text"
          formControlName="name"
          placeholder="acme"
          class="w-full rounded-md border border-gray-300 px-3 py-2 text-sm focus:border-indigo-500 focus:outline-none focus:ring-1 focus:ring-indigo-500"
        />
      </div>
      <div>
        <label for="domain" class="mb-1 block text-sm font-medium text-gray-700">Website domain</label>
        <input
          id="domain"
          type="text"
          formControlName="domain"
          placeholder="acmewidgets.com"
          class="w-full rounded-md border border-gray-300 px-3 py-2 text-sm focus:border-indigo-500 focus:outline-none focus:ring-1 focus:ring-indigo-500"
        />
      </div>
      <div>
        <label for="term" class="mb-1 block text-sm font-medium text-gray-700">Relevance term</label>
        <input
          id="term"
          type="text"
          formControlName="term"
          placeholder="widgets"
          class="w-full rounded-md border border-gray-300 px-3 py-2 text-sm focus:border-indigo-500 focus:outline-none focus:ring-1 focus:ring-indigo-500"
        />
      </div>
    </div>

    <div class="mt-4 flex gap-2">
      <button
        type="submit"
        [disabled]="loading()"
        class="rounded-md bg-indigo-600 px-4 py-2 text-sm font-medium text-white hover:bg-indigo-700 disabled:opacity-50"
      >
        {{ loading() ? 'Searching…' : 'Search' }}
      </button>
      <button
        type="button"
        (click)="reset()"
        class="rounded-md border border-gray-300 px-4 py-2 text-sm font-medium text-gray-700 hover:bg-gray-50"
      >
        Reset
      </button>
    </div>
  </form>

  @if (errorMessage()) {
    <div
      class="mb-4 rounded-md border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-800"
      role="alert"
    >
      {{ errorMessage() }}
    </div>
  }

  @if (searched()) {
    <app-company-list
      [companies]="results()"
      [loading]="loading()"
      emptyMessage="No companies match your search criteria."
    />
  } @else {
    <p class="rounded-lg border border-dashed border-gray-300 px-5 py-8 text-center text-sm text-gray-500">
      Enter criteria above and press Search. Leaving all fields empty returns every company.
    </p>
  }
</section>
